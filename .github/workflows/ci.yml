name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: |
          python manage.py test --verbosity 2

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build frontend
        working-directory: web-frontend
        run: |
          npm ci
          npm run build
      - name: Run frontend tests
        working-directory: web-frontend
        run: |
          npm ci
          npm run test --if-present

  optional-docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry (optional)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image to GHCR
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/backend
        run: |
          docker build -f Dockerfile_backend -t ${IMAGE_NAME}:${{ github.sha }} .
          docker push ${IMAGE_NAME}:${{ github.sha }}
      - name: Build and push frontend image to GHCR (optional)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/frontend
        run: |
          docker build -f web-frontend/Dockerfile -t ${IMAGE_NAME}:${{ github.sha }} .
          docker push ${IMAGE_NAME}:${{ github.sha }}
