name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy frontend to Vercel
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and build
        working-directory: web-frontend
        run: |
          npm ci
          npm run build
      - name: Deploy to Vercel using vercel CLI
        if: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd web-frontend
          npx vercel --prod --confirm --token ${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy backend to Render
    needs: [deploy-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend container (optional push to GHCR)
        env:
          REPO_NAME_LOWER: ${{ github.event.repository.name }}
        run: |
          REPO_LOWER=$(echo "$REPO_NAME_LOWER" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/$REPO_LOWER/backend"
          echo "Building backend image: $IMAGE_NAME"
          docker build -f Dockerfile_backend -t ${IMAGE_NAME}:${{ github.sha }} .
      - name: Log in to GHCR and push image (optional)
        if: ${{ secrets.GHCR_PAT }}
        run: |
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/$REPO_LOWER/backend"
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${IMAGE_NAME}:${{ github.sha }}
      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering a manual deploy on Render for service $RENDER_SERVICE_ID"
          curl -X POST https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || true
