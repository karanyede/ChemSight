version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile_backend
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - UPLOAD_ROOT=/app/backend/uploads
      - REPORT_ROOT=/app/backend/reports
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/reports:/app/backend/reports

  frontend:
    build: ./web-frontend
    ports:
      - "5173:80"
    # The nginx container will expose 80; frontend can be served at 80 via nginx
